<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Products | STACKLY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#f7f7fb] text-[#17152a]">
    <div id="toast"
        class="fixed bottom-6 left-1/2 z-50 hidden -translate-x-1/2 rounded-xl bg-[#17152a] px-5 py-3 text-white shadow-xl">
    </div>
    <header class="flex h-16 items-center justify-between border-b bg-white px-4 md:px-8"><a
            href="dashboard-tailwind.html" class="font-bold text-[#7058e8]">STACKLY</a>
        <div class="flex gap-2"><a href="dashboard.html"
                class="rounded-lg px-3 py-2 text-sm hover:bg-gray-100">Dashboard</a><a href="sales.html"
                class="rounded-lg px-3 py-2 text-sm hover:bg-gray-100">Sales</a></div>
    </header>
    <main class="mx-auto max-w-7xl p-4 md:p-8">
        <div class="mb-6 flex flex-col justify-between gap-4 md:flex-row md:items-end">
            <div>
                <p class="text-xs font-bold tracking-widest text-[#7058e8]">INVENTORY</p>
                <h1 class="text-3xl font-extrabold">Products</h1>
                <p class="text-sm text-gray-500">Manage products, stock, prices and GST.</p>
            </div><button id="add" class="rounded-xl bg-[#7058e8] px-5 py-3 font-bold text-white">+ Add Product</button>
        </div>
        <div class="mb-4 flex gap-3"><input id="search" class="flex-1 rounded-xl border bg-white p-3 outline-none"
                placeholder="Search product, category or SKU..."><select id="filter"
                class="rounded-xl border bg-white px-3">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="low">Low Stock</option>
            </select></div>
        <div class="overflow-hidden rounded-2xl border bg-white shadow-sm overflow-x-auto">
            <table class="w-full min-w-[800px] text-left text-sm">
                <thead class="border-b bg-gray-50 text-xs text-gray-500">
                    <tr>
                        <th class="p-4">PRODUCT</th>
                        <th class="p-4">CATEGORY</th>
                        <th class="p-4">SKU</th>
                        <th class="p-4">PRICE</th>
                        <th class="p-4">STOCK</th>
                        <th class="p-4">STATUS</th>
                        <th class="p-4">ACTION</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </main>
    <div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-4">
        <form id="form" class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl">
            <h2 class="text-xl font-bold">Add Product</h2><input id="name" required
                class="mt-4 w-full rounded-lg border p-3" placeholder="Product name"><input id="cat" required
                class="mt-2 w-full rounded-lg border p-3" placeholder="Category"><input id="sku" required
                class="mt-2 w-full rounded-lg border p-3" placeholder="SKU"><input id="price" required type="number"
                class="mt-2 w-full rounded-lg border p-3" placeholder="Price"><input id="stock" required type="number"
                class="mt-2 w-full rounded-lg border p-3" placeholder="Stock">
            <div class="mt-4 flex gap-2"><button
                    class="flex-1 rounded-lg bg-[#7058e8] p-3 font-bold text-white">Save</button><button type="button"
                    id="cancel" class="flex-1 rounded-lg bg-gray-100 p-3">Cancel</button></div>
        </form>
    </div>
    <script>
        let data = JSON.parse(localStorage.getItem("stacklyProducts") || "null") || [{ name: "Premium Laptop", cat: "Electronics", sku: "EL-1001", price: 54900, stock: 24 }, { name: "Office Chair", cat: "Furniture", sku: "FU-2032", price: 12900, stock: 8 }, { name: "Wireless Mouse", cat: "Accessories", sku: "AC-4410", price: 1299, stock: 42 }, { name: "GST Invoice Book", cat: "Stationery", sku: "ST-2201", price: 450, stock: 3 }];
        const $ = s => document.querySelector(s), toast = m => { let t = $("#toast"); t.textContent = m; t.classList.remove("hidden"); setTimeout(() => t.classList.add("hidden"), 2000) };
        function save() { localStorage.setItem("stacklyProducts", JSON.stringify(data)); render() }
        function render() { let q = $("#search").value.toLowerCase(), f = $("#filter").value; let a = data.filter(p => (p.name + " " + p.cat + " " + p.sku).toLowerCase().includes(q) && (f == "all" || (f == "active" && p.stock > 0) || (f == "low" && p.stock < 10))); $("#list").innerHTML = a.map(p => { let i = data.indexOf(p); return `<tr class="border-b"><td class="p-4 font-bold">${p.name}</td><td class="p-4">${p.cat}</td><td class="p-4">${p.sku}</td><td class="p-4 font-bold">₹${Number(p.price).toLocaleString("en-IN")}</td><td class="p-4">${p.stock}</td><td class="p-4"><span class="rounded-full ${p.stock < 10 ? "bg-orange-100 text-orange-700" : "bg-green-100 text-green-700"} px-2 py-1 text-xs">${p.stock < 10 ? "Low Stock" : "Active"}</span></td><td class="p-4"><button onclick="edit(${i})" class="mr-2 text-[#7058e8]">Edit</button><button onclick="del(${i})" class="text-red-600">Delete</button></td></tr>` }).join("") || '<tr><td colspan="7" class="p-8 text-center text-gray-500">No products found.</td></tr>' }
        function edit(i) { let n = prompt("Product name", data[i].name); if (n) { data[i].name = n; save(); toast("Product updated") } } function del(i) { if (confirm("Delete this product?")) { data.splice(i, 1); save(); toast("Product deleted") } }
        $("#search").oninput = render; $("#filter").onchange = render; $("#add").onclick = () => { $("#modal").classList.remove("hidden"); $("#modal").classList.add("flex") }; $("#cancel").onclick = () => { $("#modal").classList.add("hidden"); $("#modal").classList.remove("flex") };
        $("#form").onsubmit = e => { e.preventDefault(); data.push({ name: $("#name").value, cat: $("#cat").value, sku: $("#sku").value, price: +$("#price").value, stock: +$("#stock").value }); save(); e.target.reset(); $("#cancel").click(); toast("Product added successfully") }; render();
    </script>
</body>

</html>
